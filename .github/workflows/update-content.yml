name: Update optics intelligence data

on:
  schedule:
    # 05:17 UTC is inside DeepSeek's current weekday off-peak window.
    # The cadence gate below performs the actual refresh once every 72 hours.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Ignore stored content hashes and reprocess every source
        required: false
        default: false
        type: boolean
      max_sources:
        description: Optional source limit for a test run (0 means all)
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: optics-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      site_changed: ${{ steps.commit.outputs.site_changed }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-flash
      UPDATE_TRIGGER: ${{ github.event_name }}
      FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
      MAX_SOURCES: ${{ inputs.max_sources || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check three-day cadence
        id: cadence
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Manual update requested; bypassing the cadence gate."
            exit 0
          fi
          due=$(python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          state = json.loads(Path("data/update-state.json").read_text(encoding="utf-8"))
          value = state.get("last_scheduled_run_at")
          if not value:
              print("true")
          else:
              last_run = datetime.fromisoformat(value.replace("Z", "+00:00"))
              print("true" if datetime.now(timezone.utc) - last_run >= timedelta(hours=72) else "false")
          PY
          )
          echo "due=$due" >> "$GITHUB_OUTPUT"
          if [ "$due" != "true" ]; then
            echo "The last successful scheduled update was less than 72 hours ago."
          fi

      - name: Set up Python
        if: steps.cadence.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Install updater dependencies
        if: steps.cadence.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-update.txt
          crawl4ai-setup

      - name: Crawl, extract, and merge
        if: steps.cadence.outputs.due == 'true'
        run: |
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then args+=(--force); fi
          if [ "$MAX_SOURCES" != "0" ]; then args+=(--max-sources "$MAX_SOURCES"); fi
          python scripts/update_content.py "${args[@]}"

      - name: Validate generated data
        if: steps.cadence.outputs.due == 'true'
        run: |
          node scripts/validate-data.mjs
          node --check dist/app.js
          python scripts/update_content.py --self-test

      - name: Commit changed data
        id: commit
        if: steps.cadence.outputs.due == 'true'
        run: |
          if git diff --quiet -- dist/app.js data/update-state.json; then
            echo "No repository data changed."
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- dist/app.js; then
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js data/update-state.json
          git commit -m "chore(data): refresh optics intelligence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: update
    if: needs.update.outputs.site_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out updated repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate static data
        run: |
          node scripts/validate-data.mjs
          node --check dist/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
