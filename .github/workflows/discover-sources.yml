name: Discover optics sources

on:
  workflow_dispatch:
    inputs:
      max_profiles:
        description: Maximum trusted-directory profile pages to inspect
        required: false
        default: "320"
        type: string
      max_candidates:
        description: Maximum new domains sent to DeepSeek for review
        required: false
        default: "240"
        type: string
      max_search_queries:
        description: Maximum AI-planned web searches (directories still run too)
        required: false
        default: "18"
        type: string
      max_search_results:
        description: Maximum web-search result links considered before deduplication
        required: false
        default: "120"
        type: string
      promote_limit:
        description: Maximum accepted companies added in this run
        required: false
        default: "100"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: optics-content-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-flash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Install discovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-update.txt
          crawl4ai-setup
      - name: Discover and review sources
        run: >-
          python scripts/discover_sources.py
          --max-profiles "${{ inputs.max_profiles }}"
          --max-candidates "${{ inputs.max_candidates }}"
          --max-search-queries "${{ inputs.max_search_queries }}"
          --max-search-results "${{ inputs.max_search_results }}"
          --promote-limit "${{ inputs.promote_limit }}"
      - name: Extract updates from tracked sources
        env:
          UPDATE_TRIGGER: workflow_dispatch
        run: |
          python scripts/sync_source_companies.py
          python scripts/update_content.py
      - name: Validate result
        run: |
          python scripts/discover_sources.py --self-test
          python scripts/sync_source_companies.py --self-test
          node scripts/validate-data.mjs
          node --check dist/app.js
      - name: Commit discovered sources and extracted updates
        run: |
          if [ -z "$(git status --porcelain -- dist data)" ]; then
            echo "No new sources passed review."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data
          git commit -m "chore(data): discover and index optics sources"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
